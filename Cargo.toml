[package]
name = "lidar-ld19"
version = "0.2.2"
edition = "2021"
authors = ["12345qiupeng <>", "YdrMaster <ydrml@hotmail.com>"]
readme = "README.md"

[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "frog_eye"
path = "src/bin/frog_eye.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
log = "*"
env_logger = "0.11"
minifb = "0.27"
kdtree = "0.7"
smartcore = { version = "0.3", features = ["serde"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.19"
